<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pixel Brawl</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<audio id="menu-bgm" src="assets/audio/menu-theme.ogg" preload="auto" hidden></audio>
<canvas id="game" width="960" height="540"></canvas>
<div id="pad">
  <div class="dp">
    <button data-k="KeyW" style="grid-area:1/2">&#9650;</button>
    <button data-k="KeyA" style="grid-area:2/1">&#9664;</button>
    <button data-k="KeyS" style="grid-area:2/2">&#9660;</button>
    <button data-k="KeyD" style="grid-area:2/3">&#9654;</button>
  </div>
  <div class="ac"><button data-k="KeyF">PUNCH</button><button data-k="KeyG">KICK</button><button data-k="KeyH">FIRE</button><button data-k="KeyJ">SUPER</button><button data-k="KeyV">BLOCK</button></div>
</div>
<button id="mn" data-k="Escape">MENU</button>
<noscript>Pixel Brawl needs JavaScript enabled.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
