<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alley Fury</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#120a1c}
body{display:grid;place-items:center}
canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const C=document.getElementById('c'),g=C.getContext('2d'),W=960,H=540,GY=470;
const KEYS={};
addEventListener('keydown',e=>{if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();if(e.repeat)return;KEYS[e.code]=1;actx();onKey(e.code)});
addEventListener('keyup',e=>KEYS[e.code]=0);
let AC;function actx(){if(!AC)try{AC=new AudioContext}catch(e){}}
function sfx(fr,d,type='square',v=.06){if(!AC)return;const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,fr/3),t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a).connect(AC.destination);o.start();o.stop(t+d)}

const MAP=[{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',p:'KeyF',k:'KeyG',s:'KeyH'},
           {l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',p:'KeyK',k:'KeyL',s:'Semicolon'}];
const read=m=>{const o={};for(const k in m)o[k]=!!KEYS[m[k]];return o};

// s=startup, a=active, r=recovery frames
const ATK={p:{s:4,a:4,r:9,dmg:6,reach:75,y:-100,h:32,st:14,kb:4},
           k:{s:7,a:5,r:13,dmg:10,reach:95,y:-70,h:40,st:19,kb:7},
           s:{s:11,a:0,r:26}};
const SKIN=[{gi:'#e8e2d0',band:'#e63946',skin:'#c68642',hair:'#1a1a1a',pants:'#2b2d42'},
            {gi:'#2a9d8f',band:'#f4d35e',skin:'#f1c27d',hair:'#7b2d26',pants:'#264653'}];
let P=[],FB=[],G={mode:'menu'},shake=0,stop=0,fr=0,twoP=false;

function mk(x,face,c,name,ai){return{x,y:GY,vx:0,vy:0,face,hp:100,show:100,c,name,ai:ai?{t:0,m:'wait'}:null,atk:null,t:0,hit:0,stun:0,cd:0,crouch:0,block:0,prev:{},wins:0,walk:0,flash:0}}
function start(two){twoP=two;P=[mk(0,1,SKIN[0],'KAI',false),mk(0,-1,SKIN[1],'ROX',!two)];G={mode:'intro',n:0};newRound()}
function newRound(){P.forEach((f,i)=>Object.assign(f,{x:i?660:300,y:GY,vx:0,vy:0,face:i?-1:1,hp:100,show:100,atk:null,stun:0,cd:0,t:0,crouch:0,block:0,flash:0}));
  FB=[];G.mode='intro';G.t=0;G.tk=0;G.time=60;G.n++}
function onKey(k){
  if(G.mode==='menu'){if(k==='Digit1'||k==='Numpad1')start(false);if(k==='Digit2'||k==='Numpad2')start(true)}
  else if(G.mode==='match'&&k==='Enter')start(twoP);
  if(k==='Escape')G={mode:'menu'};
}

const hurt=o=>({x1:o.x-28,x2:o.x+28,y1:o.y-(o.crouch?85:135),y2:o.y});
function land(f,o,dmg,st,kb){
  const blk=o.block&&!o.atk&&o.stun<=0&&o.y>=GY;
  if(blk){dmg=Math.ceil(dmg/6);st=9;kb*=.8;sfx(140,.08,'triangle',.08);o.flash=0}
  else{stop=5;shake=7;o.flash=6;sfx(200,.15,'sawtooth',.09)}
  o.hp=Math.max(0,o.hp-dmg);o.stun=st;o.vx=f.face*kb;o.atk=null;o.hit=0;
  if(o.hp<=0){o.stun=999;o.vx=f.face*6;o.vy=-10;stop=12;shake=14;sfx(90,.5,'sawtooth',.12)}
}
function strike(f,o,A){
  const x1=f.x+f.face*15,x2=f.x+f.face*(15+A.reach),hx=Math.min(x1,x2),hw=Math.abs(x2-x1),y1=f.y+A.y,y2=y1+A.h,b=hurt(o);
  if(o.hp>0&&hx<b.x2&&hx+hw>b.x1&&y1<b.y2&&y2>b.y1){f.hit=1;land(f,o,A.dmg,A.st,A.kb)}
}
function upd(f,o,i){
  const gr=f.y>=GY,ko=f.hp<=0;
  if(f.cd)f.cd--;
  if(!ko&&f.stun<=0&&!f.atk)f.face=o.x>=f.x?1:-1;
  if(ko||f.stun>0){f.stun--;f.vx*=.88;f.block=0;f.crouch=0}
  else if(f.atk){
    f.t++;const A=ATK[f.atk];
    if(f.atk==='s'){if(f.t===A.s){FB.push({x:f.x+f.face*55,y:GY-85,v:f.face*10,o:f,face:f.face});sfx(300,.3,'sawtooth')}}
    else if(f.t>=A.s&&f.t<A.s+A.a&&!f.hit)strike(f,o,A);
    if(f.t>=A.s+A.a+A.r)f.atk=null;
    if(gr)f.vx=0;
  }else{
    f.crouch=gr&&i.d?1:0;
    const dir=(i.r?1:0)-(i.l?1:0),back=dir!==0&&dir===-f.face;
    f.block=gr&&back?1:0;
    if(gr){f.vx=f.crouch?0:dir*(back?3:4.5);if(i.u&&!f.crouch){f.vy=-19;f.vx=dir*4.5}}
    const pr=k=>i[k]&&!f.prev[k];
    if(pr('s')&&gr&&!f.cd){f.atk='s';f.t=0;f.cd=70;f.vx=0;f.hit=0}
    else if(pr('p')){f.atk='p';f.t=0;f.hit=0;sfx(420,.06)}
    else if(pr('k')){f.atk='k';f.t=0;f.hit=0;sfx(320,.08)}
  }
  f.prev=i;f.walk+=Math.abs(f.vx)*.09;f.x+=f.vx;
  if(f.y<GY||f.vy<0){f.vy+=1;f.y+=f.vy;if(f.y>=GY){f.y=GY;f.vy=0;if(!f.atk)f.vx=0}}
  f.x=Math.max(40,Math.min(W-40,f.x));
}
function cpu(f,o){
  const a=f.ai,d=Math.abs(o.x-f.x),i={},tw=o.x>f.x?'r':'l',aw=tw==='r'?'l':'r',r=Math.random();
  if(--a.t<=0){a.t=8+Math.random()*18|0;
    a.m=d>320?(r<.3?'fire':'fwd'):d>140?(r<.45?'fwd':r<.55?'jump':r<.8?'fire':'wait'):(r<.35?'p':r<.6?'k':r<.75?'back':r<.85?'duck':'wait')}
  if(o.atk&&d<150&&Math.random()<.05)a.m='back';
  if(FB.some(b=>b.o!==f&&Math.abs(b.x-f.x)<220)&&Math.random()<.08)a.m=Math.random()<.5?'back':'jump';
  switch(a.m){case'fwd':i[tw]=1;break;case'back':i[aw]=1;break;case'duck':i.d=1;break;
    case'jump':i.u=1;i[tw]=1;a.m='wait';break;case'fire':i.s=1;a.m='wait';break;
    case'p':i.p=1;a.m='wait';break;case'k':i.k=1;a.m='wait'}
  return i;
}
function physics(live){
  P.forEach((f,n)=>{const o=P[1-n];upd(f,o,live?(f.ai?cpu(f,o):read(MAP[n])):{})});
  const d=P[1].x-P[0].x;
  if(Math.abs(d)<55&&Math.abs(P[0].y-P[1].y)<60){const p=(55-Math.abs(d))/2,s=d>=0?1:-1;P[0].x-=s*p;P[1].x+=s*p;P.forEach(f=>f.x=Math.max(40,Math.min(W-40,f.x)))}
  FB=FB.filter(b=>{b.x+=b.v;const o=P[0]===b.o?P[1]:P[0],h=hurt(o);
    if(o.hp>0&&b.x>h.x1-14&&b.x<h.x2+14&&b.y>h.y1&&b.y<h.y2){land(b,o,12,22,8);return false}
    return b.x>-50&&b.x<W+50});
}
function step(){
  fr++;
  if(G.mode==='intro'){G.t++;if(G.t>120){G.mode='fight';G.t=0}}
  else if(G.mode==='fight'){
    if(stop>0)stop--;
    else{
      physics(true);
      if(++G.tk%60===0)G.time--;
      const[a,b]=P;
      if(a.hp<=0||b.hp<=0||G.time<=0){G.w=a.hp===b.hp?-1:a.hp>b.hp?0:1;if(G.w>=0)P[G.w].wins++;G.mode='end';G.t=0}
    }
  }else if(G.mode==='end'){
    G.t++;if(stop>0)stop--;else physics(false);
    if(G.t>180){G.mode=P.some(f=>f.wins>=2)?'match':'intro';if(G.mode==='intro')newRound()}
  }
  shake*=.85;
  P.forEach(f=>{if(f.flash>0)f.flash--;if(f.show>f.hp)f.show=Math.max(f.hp,f.show-.35)});
}

// ---------- rendering ----------
const BG=document.createElement('canvas');BG.width=W;BG.height=H;
(function(){
  const c=BG.getContext('2d');let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647;
  const sky=c.createLinearGradient(0,0,0,GY);sky.addColorStop(0,'#1b0f3a');sky.addColorStop(.55,'#8a2b5c');sky.addColorStop(1,'#ff9a4d');
  c.fillStyle=sky;c.fillRect(0,0,W,H);
  c.fillStyle='#ffd58a';c.beginPath();c.arc(690,340,95,0,7);c.fill();
  [{col:'#4a1d5c',min:120,max:260,win:0},{col:'#241040',min:60,max:200,win:1}].forEach(L=>{
    c.fillStyle=L.col;
    for(let x=-10;x<W;){const w=50+rnd()*70,h=L.min+rnd()*(L.max-L.min);
      c.fillStyle=L.col;c.fillRect(x,GY-h,w,h);
      if(L.win)for(let y=GY-h+12;y<GY-14;y+=20)for(let wx=x+8;wx<x+w-10;wx+=16)if(rnd()<.35){c.fillStyle='#ffd58a';c.fillRect(wx,y,6,9)}
      x+=w+4}
  });
  c.fillStyle='#1d0e2a';c.fillRect(0,GY,W,H-GY);
  c.strokeStyle='rgba(255,255,255,.07)';
  for(let i=-12;i<=12;i++){c.beginPath();c.moveTo(W/2+i*20,GY);c.lineTo(W/2+i*140,H);c.stroke()}
  c.fillStyle='#5a2f6b';c.fillRect(0,GY,W,4);
  c.save();c.shadowColor='#ff3d6e';c.shadowBlur=18;c.fillStyle='#ff3d6e';c.font='bold 28px monospace';c.fillText('RAMEN',70,330);c.restore();
})();

function tx(s,x,y,sz=20,col='#fff',al='center'){g.font=`${sz}px "Press Start 2P",monospace`;g.textAlign=al;g.fillStyle='#000';g.fillText(s,x+3,y+3);g.fillStyle=col;g.fillText(s,x,y)}

function drawF(f){
  const ko=f.hp<=0,ch=f.crouch?.68:(f.y<GY?.85:1),A=f.atk&&ATK[f.atk],c=f.c,w=Math.sin(f.walk)*8;
  const ext=A&&f.t>=A.s-2&&f.t<A.s+A.a+3;
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(f.x,GY+4,Math.max(12,38-(GY-f.y)/10),8,0,0,7);g.fill();
  g.save();g.translate(f.x,f.y);g.scale(f.face,1);
  if(ko){g.translate(0,f.y>=GY?-24:0);g.rotate(f.y>=GY?-1.5:-.8)}else if(f.stun>0)g.rotate(-.15);
  const lh=52*ch,top=-100*ch;
  g.fillStyle=c.gi;g.fillRect(-32,top+8,12,38*ch);                         // back arm
  g.fillStyle=c.pants;g.fillRect(-22-w,-lh,18,lh);                          // back leg
  g.fillStyle=c.gi;g.fillRect(-26,top,52,-top-lh+6);                        // torso
  g.fillStyle=c.band;g.fillRect(-26,-lh-8,52,8);                            // belt
  g.fillStyle=c.pants;
  if(f.atk==='k'&&ext){g.fillRect(4,-lh-6,A.reach-14,16);g.fillStyle=c.skin;g.fillRect(A.reach-26,-lh-10,18,24)}
  else g.fillRect(4+w,-lh,18,lh);
  g.fillStyle=c.skin;g.fillRect(-14,top-30,28,28);                          // head
  g.fillStyle=c.hair;g.fillRect(-15,top-34,30,10);
  g.fillStyle=c.band;g.fillRect(-15,top-22,30,6);g.fillRect(-26,top-20,12,4);
  g.fillStyle='#111';g.fillRect(5,top-14,6,4);
  if(f.atk==='p'&&ext){g.fillStyle=c.gi;g.fillRect(10,top+10,A.reach-16,14);g.fillStyle=c.skin;g.fillRect(A.reach-22,top+6,20,22)}
  else if(f.atk==='s'){g.fillStyle=c.gi;g.fillRect(10,top+14,44,14);g.fillStyle=c.skin;g.fillRect(46,top+11,16,20);
    if(f.t>=ATK.s.s-3){g.fillStyle='rgba(255,180,60,.6)';g.beginPath();g.arc(66,top+21,16,0,7);g.fill()}}
  else if(f.block){g.fillStyle=c.gi;g.fillRect(12,top-8,14,46);g.fillStyle=c.skin;g.fillRect(12,top-14,14,12)}
  else{g.fillStyle=c.gi;g.fillRect(12,top+10,14,36*ch);g.fillStyle=c.skin;g.fillRect(12,top+10+36*ch,14,12)}
  if(f.flash>0){g.fillStyle='rgba(255,255,255,.6)';g.fillRect(-34,top-36,68,-top+36)}
  g.restore();
}
function drawFB(b){
  for(let k=3;k>=0;k--){const x=b.x-b.face*k*14;g.fillStyle=`rgba(255,150,40,${.15+.1*(3-k)})`;g.beginPath();g.arc(x,b.y,22-k*3,0,7);g.fill()}
  const r=g.createRadialGradient(b.x,b.y,2,b.x,b.y,22);r.addColorStop(0,'#fff');r.addColorStop(.5,'#ffd23f');r.addColorStop(1,'rgba(255,90,40,0)');
  g.fillStyle=r;g.beginPath();g.arc(b.x,b.y,24,0,7);g.fill();
}
function hud(){
  P.forEach((f,n)=>{
    const w=380,x=n?W-40-w:40;
    g.fillStyle='#000';g.fillRect(x-4,24,w+8,30);
    const bar=(v,col)=>{g.fillStyle=col;const ww=w*v/100;g.fillRect(n?x:x+w-ww,28,ww,22)};
    bar(f.show,'#ffd23f');bar(f.hp,f.hp>30?'#3ddc84':'#ff4d4d');
    tx(f.name,n?x+w:x,82,14,'#fff',n?'right':'left');
    for(let i=0;i<2;i++){g.fillStyle=i<f.wins?'#ffd23f':'#000';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(n?x+8+i*22:x+w-8-i*22,98,7,0,7);g.fill();g.stroke()}
  });
  tx(String(Math.max(0,G.time)).padStart(2,'0'),W/2,60,28,'#ffd58a');
}
function render(){
  g.save();
  if(shake>.5)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  g.drawImage(BG,0,0);
  if(G.mode==='menu'){
    g.fillStyle='rgba(10,4,20,.55)';g.fillRect(0,0,W,H);
    tx('ALLEY FURY',W/2,160,52,'#ffd23f');
    tx('1  -  1 PLAYER VS CPU',W/2,260,18);tx('2  -  2 PLAYERS',W/2,300,18);
    tx('P1  WASD  F punch  G kick  H fireball',W/2,380,11,'#ddd');
    tx('P2  ARROWS  K punch  L kick  ; fireball',W/2,405,11,'#ddd');
    tx('Hold back to block  -  Esc for menu',W/2,440,11,'#ddd');
  }else{
    P.forEach(drawF);FB.forEach(drawFB);hud();
    if(G.mode==='intro')tx(G.t<70?'ROUND '+G.n:'FIGHT!',W/2,250,G.t<70?40:52,G.t<70?'#fff':'#ff5a3c');
    if(G.mode==='end'){
      tx(G.time<=0&&P.every(f=>f.hp>0)?'TIME UP':'K.O.',W/2,230,56,'#ff5a3c');
      if(G.t>50)tx(G.w<0?'DRAW':P[G.w].name+' WINS',W/2,300,24);
    }
    if(G.mode==='match'){
      g.fillStyle='rgba(10,4,20,.6)';g.fillRect(0,0,W,H);
      tx(P.find(f=>f.wins>=2).name+' WINS THE MATCH',W/2,240,28,'#ffd23f');
      tx('ENTER - rematch    ESC - menu',W/2,300,14);
    }
  }
  g.restore();
}
let last=0,acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60}render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
